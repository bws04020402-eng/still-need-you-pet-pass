<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>孩要有你｜電子計次券</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f4f1;
      --ink: #1f1f1f;
      --muted: #777;
      --line: #e6e6e2;
      --ok: #18733b;
      --warn: #8a6700;
      --danger: #a62d2d;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .app {
      max-width: 760px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #171717;
      color: white;
      padding: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    header p {
      margin: 4px 0 0;
      color: #bbb;
      font-size: 13px;
    }

    .page {
      padding: 14px;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,.035);
    }

    h2,
    h3 {
      margin: 0 0 12px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 540px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      color: #666;
      font-size: 13px;
      margin: 10px 0 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8d8d4;
      border-radius: 12px;
      background: white;
      color: #222;
    }

    textarea {
      min-height: 74px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px 14px;
      margin-top: 10px;
      background: #222;
      color: white;
      font-weight: 800;
    }

    .btn:disabled {
      opacity: .55;
    }

    .btn.secondary {
      background: #efefec;
      color: #222;
    }

    .btn.danger {
      background: var(--danger);
    }

    .btn.small {
      width: auto;
      margin: 0;
      padding: 9px 11px;
      font-size: 13px;
    }

    .tabs {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      max-width: 760px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: white;
      border-top: 1px solid #ddd;
      z-index: 30;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tab {
      border: 0;
      background: white;
      padding: 13px 5px;
      color: #777;
    }

    .tab.active {
      color: #111;
      font-weight: 900;
    }

    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: #171717;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      margin: auto;
      background: white;
      border-radius: 22px;
      padding: 26px 20px;
    }

    .login-box h1 {
      margin: 0 0 4px;
    }

    .error {
      color: var(--danger);
      font-size: 13px;
    }

    .searchbar {
      position: sticky;
      top: 82px;
      background: var(--bg);
      z-index: 12;
      padding-bottom: 8px;
    }

    .searchbox {
      font-size: 17px;
      padding: 14px;
      border: 2px solid #222;
    }

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 8px 0 2px;
    }

    .chip {
      border: 1px solid #d3d3cf;
      background: white;
      border-radius: 999px;
      padding: 8px 11px;
      white-space: nowrap;
    }

    .chip.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .pass-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .pass-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .pet {
      font-size: 20px;
      font-weight: 900;
    }

    .owner {
      font-weight: 700;
    }

    .status {
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 999px;
      background: #eee;
      white-space: nowrap;
    }

    .status.active {
      background: #dff4e5;
      color: var(--ok);
    }

    .status.soon {
      background: #fff0bf;
      color: var(--warn);
    }

    .status.expired,
    .status.completed {
      background: #f9dddd;
      color: var(--danger);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .summary > div {
      background: #f6f6f3;
      border-radius: 12px;
      padding: 10px;
    }

    .summary b {
      display: block;
      font-size: 18px;
    }

    .paper {
      border: 2px solid #333;
      border-radius: 22px;
      padding: 16px;
      background: white;
    }

    .paper-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 18px;
    }

    @media (max-width: 560px) {
      .paper-grid {
        grid-template-columns: 1fr;
      }
    }

    .paper-row {
      font-size: 14px;
      border-bottom: 1px dashed #ccc;
      padding: 7px 0;
    }

    .rules {
      margin: 12px 0 0;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.55;
    }

    .history-row {
      border-top: 1px dashed #bbb;
      padding: 12px 0;
    }

    .history-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
    }

    .gift {
      color: #8a5b00;
    }

    .signature-wrap {
      border: 2px solid #333;
      background: white;
      border-radius: 14px;
      overflow: hidden;
    }

    #signatureCanvas {
      width: 100%;
      height: 320px;
      display: block;
      touch-action: none;
      background: white;
    }

    .signature-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px;
      border-top: 1px solid #ddd;
    }

    .notice {
      padding: 11px;
      border-radius: 12px;
      background: #fff3c9;
      color: #655000;
      font-size: 13px;
      margin: 10px 0;
    }

    .record-row {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .record-row:last-child {
      border-bottom: 0;
    }

    .record-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .signed {
      color: var(--ok);
      font-weight: 800;
    }

    .unsigned {
      color: var(--danger);
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .top-actions .btn {
      margin: 0;
    }
  </style>
</head>

<body>

<div id="loginScreen" class="login">
  <div class="login-box">

    <h1>孩要有你</h1>
    <p class="muted">電子計次券</p>

    <label>登入 Email</label>
    <input

<button

>

</button>
    <p id="loginMessage" class="muted"></p>

  </div>
</div>

<div id="mainApp" class="app hidden">

  <header>
    <h1>孩要有你｜電子計次券</h1>
    <p id="loginUser"></p>
  </header>

  <main>

    <!-- 查券 / 簽名 -->

          <button

            data-filter="completed"

        </div>
      </div>

      <div

      <div id="searchResults"></div>

    </section>

    <!-- 開券 -->
    <section

    >

      <div class="card">

        <h2>建立電子計次券</h2>

        <div class="grid">

          <div>
            <label>飼主姓名</label>
            <input id="ownerName">
          </div>

          <div>

          <div>

          </div>

          <div>
            <label>加購造型金額</label>
            <input

          </div>

          <div>

            <input

          </div>

          <div>

            <input

          </div>

          <div>
            <label>總金額</label>

          <div>

          <div>

          <button

      <div class="card">

</div>

<!-- 結帳 / 簽名視窗 -->
<div

>

      inset:0;

<script>

const SUPABASE_URL =
  "https://kytdrgmwyupjzjdyjhjh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ZEoEcNmr5dMoZtIEGdPCfA_ffav8l9O";

let client = null;

let passes = [];
let transactions = [];

let selectedPass = null;

let passFilter = "active";
let recordFilter = "all";

let drawing = false;
let signatureHasInk = false;


/* =========================
   基本工具
========================= */

function today() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function esc(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function money(value) {

  return Number(value || 0)
    .toLocaleString("zh-TW");
}

function num(id) {

  return Number(
    document
      .getElementById(id)
      .value || 0
  );
}

function addDays(dateString, days) {
  if (!dateString) {
    return "";
  }

  const [y, m, d] = dateString.split("-").map(Number);
  const date = new Date(y, m - 1, d);

  date.setDate(date.getDate() + days);

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function daysUntil(dateString) {

  if (!dateString) {
    return 9999;
  }

  const a =
    new Date(
      today() +
      "T00:00:00"
    );

  const b =
    new Date(
      dateString +
      "T00:00:00"
    );

  return Math.ceil(
    (b - a) /
    86400000
  );
}


/* =========================
   初始化
========================= */

async function init() {

  try {

    if (!window.supabase) {

      throw new Error(
        "Supabase 載入失敗"
      );
    }

    client =
      window.supabase
        .createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        );

    document
      .getElementById("paymentDate")
      .value =
      today();

    document
      .getElementById("serviceDate")
      .value =
      today();

    document
      .getElementById("recordDate")
      .value =
      today();

    autoExpiry();

    const {
      data,
      error
    } =
      await client
        .auth
        .getSession();

    if (error) {
      throw error;
    }

    if (
      data?.session?.user
    ) {

      await openApp(
        data.session.user
      );
    }

  } catch (error) {

    const message =
      document
        .getElementById(
          "loginMessage"
        );

    message.textContent =
      "系統初始化失敗：" +
      (
        error?.message ||
        String(error)
      );

    message.className =
      "error";
  }
}


/* =========================
   登入
========================= */

async function login() {

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();

  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;

  const button =
    document
      .getElementById(
        "loginButton"
      );

  if (
    !email ||
    !password
  ) {

    document
      .getElementById(
        "loginMessage"
      )
      .textContent =
      "請輸入 Email 與密碼";

    return;
  }

  button.disabled = true;
  button.textContent =
    "登入中...";

  const {
    data,
    error
  } =
    await client
      .auth
      .signInWithPassword({
        email,
        password
      });

  button.disabled = false;
  button.textContent =
    "登入系統";

  if (error) {

    const message =
      document
        .getElementById(
          "loginMessage"
        );

    message.textContent =
      "登入失敗：" +
      error.message;

    message.className =
      "error";

    return;
  }

  await openApp(
    data.user
  );
}
async function signup() {
  const email = document
    .getElementById("loginEmail")
    .value
    .trim();

  const password = document
    .getElementById("loginPassword")
    .value;

  const message = document.getElementById("loginMessage");
  const button = document.getElementById("signupButton");

  if (!email || !password) {
    message.textContent = "請輸入 Email 與密碼";
    message.className = "error";
    return;
  }

  if (password.length < 6) {
    message.textContent = "密碼至少需要 6 個字元";
    message.className = "error";
    return;
  }

  button.disabled = true;
  button.textContent = "註冊中...";

  const { data, error } = await client.auth.signUp({
    email,
    password
  });

  button.disabled = false;
  button.textContent = "註冊新帳號";

  if (error) {
    message.textContent = "註冊失敗：" + error.message;
    message.className = "error";
    return;
  }

  if (data && data.session) {
    message.textContent = "註冊成功，正在登入...";
    message.className = "muted";
    await openApp(data.user);
    return;
  }

  message.textContent =
    "註冊成功！請到 Email 收驗證信，驗證完成後再回來登入。";
  message.className = "muted";
}
async function logout() {

  await client

async function openApp(user) {

/* =========================
   讀取資料
========================= */

async function refreshData() {

  const passResult =
    await client
      .from("passes")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (
    passResult.error
  ) {

    throw new Error(
      "計次券讀取失敗：" +
      passResult.error.message
    );
  }

  passes =
    passResult.data ||
    [];

  const transactionResult =
    await client
      .from("transactions")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (
    transactionResult.error
  ) {

    throw new Error(
      "紀錄讀取失敗：" +
      transactionResult
        .error
        .message
    );
  }

  transactions =
    transactionResult.data ||
    [];

  renderSearchResults();
  renderRecords();

  if (selectedPass) {

    selectedPass =
      passes.find(
        p =>
          p.id ===
          selectedPass.id
      ) ||
      selectedPass;

    renderSelectedPass();
  }
}


/* =========================
   次數
========================= */

function usedTransactions(
  passId
) {

  return transactions
    .filter(
      t =>
        t.pass_id ===
        passId &&
        !t.voided &&
        t.redeemed !== false
    );
}

function getUsedCount(
  passId
) {

  return usedTransactions(
    passId
  ).length;
}

function totalUses(pass) {

  return Number(
    pass.total_uses ||
    5
  );
}

function getRemaining(
  pass
) {

  return Math.max(
    0,
    totalUses(pass) -
    getUsedCount(pass.id)
  );
}


/* =========================
   計次券狀態
========================= */

function getPassStatus(
  pass
) {

  if (
    pass.status ===
    "archived"
  ) {
    return "archived";
  }

  if (
    getRemaining(pass) <= 0
  ) {
    return "completed";
  }

  const days =
    daysUntil(
      pass.expiry_date
    );

  if (days < 0) {
    return "expired";
  }

  if (days <= 7) {
    return "soon";
  }

  return "active";
}

function statusText(
  status
) {

  return {
    active: "有效",
    soon: "7天內到期",
    expired: "已到期",
    completed: "已用完",
    archived: "已封存"
  }[status] ||
  status;
}

========================= */

function setPassFilter(
  filter,
  button
) {

  passFilter =
    filter;

  document
    .querySelectorAll(
      "[data-filter]"
    )
    .forEach(
      element => {
        element
          .classList
          .remove("active");
      }
    );

  button
    .classList
    .add("active");

  renderSearchResults();
}

function renderSearchResults() {

  const searchBox =
    document
      .getElementById(
        "quickSearch"
      );

  if (!searchBox) {
    return;
  }

  const keyword =
    searchBox
      .value
      .trim()
      .toLowerCase();

  let list =
    passes
      .filter(
        pass => {

          const text = [
            pass.pet_name,
            pass.owner_name,
            pass.phone,
            pass.breed,
            pass.shared_pet_name
          ]
            .join(" ")
            .toLowerCase();

          if (
            keyword &&
            !text.includes(
              keyword
            )
          ) {
            return false;
          }

          const status =
            getPassStatus(
              pass
            );

          if (
            passFilter ===
            "all"
          ) {
            return true;
          }

          if (
            passFilter ===
            "active"
          ) {

            return (
              status ===
              "active" ||
              status ===
              "soon"
            );
          }

          return (
            status ===
            passFilter
          );
        }
      );

  const box =
    document
      .getElementById(
        "searchResults"
      );

  if (!list.length) {

    box.innerHTML =
      '<div class="card muted">找不到符合的計次券</div>';

    return;
  }

  box.innerHTML =
    list
      .map(
        pass => {

          const status =
            getPassStatus(
              pass
            );

          const remaining =
            getRemaining(
              pass
            );

          return `
            <div
              class="pass-card"
              onclick="selectPass('${pass.id}')"
            >

              <div class="pass-top">

                <div>

                  <div class="pet">
                    ${esc(
                      pass.pet_name ||
                      ""
                    )}
                  </div>

                  <div class="owner">
                    ${esc(
                      pass.owner_name ||
                      ""
                    )}
                    ・
                    ${esc(
                      pass.phone ||
                      ""
                    )}
                  </div>

                  <div class="muted">
                    ${esc(
                      pass.breed ||
                      ""
                    )}
                    ${
                      pass.shared_pass
                        ? " ・ 共用券"
                        : ""
                    }
                  </div>

                </div>

                <span
                  class="status ${status}"
                >
                  ${statusText(
                    status
                  )}
                </span>

              </div>

              <div class="summary">

                <div>
                  <span class="muted">
                    剩餘
                  </span>

                  <b>
                    ${remaining}
                    /
                    ${totalUses(
                      pass
                    )}
                  </b>
                </div>

                <div>
                  <span class="muted">
                    到期
                  </span>

                  <b style="font-size:14px">
                    ${

                <div>

function autoExpiry() {

  const payment =
    document
      .getElementById(
        "paymentDate"
      )
      .value;

  const shared =
    document
      .getElementById(
        "sharedPass"
      )
      .checked;

  document
    .getElementById(
      "expiryDate"
    )
    .value =
    addDays(
      payment,
      shared
        ? 25
        : 45
    );
}

function autoTotalPaid() {
  const total =
    (Number(document.getElementById("passAmount").value) || 0) +
    (Number(document.getElementById("stylingAddonAmount").value) || 0) +
    (Number(document.getElementById("passAddonAmount").value) || 0) +
    (Number(document.getElementById("spaAddonAmount").value) || 0);

  document.getElementById("totalPaid").value =
    total === 0 ? "" : total;
}

[
  "passAmount",
  "stylingAddonAmount",
  "passAddonAmount",
  "spaAddonAmount"
].forEach(id => {
  document
    .getElementById(id)
    .addEventListener("input", autoTotalPaid);
});

document.getElementById("totalPaid").readOnly = true;

async function createPass() {

  const pet =

      .getElementById(

      )

      .trim();

  if (
    !owner ||
    !pet
  ) {

    alert(
      "請填飼主姓名與毛孩名字"
    );

    return;
  }

  const row = {

    owner_name:
      owner,

    phone:
      document
        .getElementById(
          "phone"
        )
        .value
        .trim(),

    pet_name:
      pet,

    breed:
      document
        .getElementById(
          "breed"
        )
        .value
        .trim(),

    pass_amount:
      num(
        "passAmount"
      ),

        .getElementById(

        )
        .value
        .trim(),

        "stylingAddonAmount"
      ),

      num(
        "passAddonAmount"
      ),

    spa_addon_amount:
      num(
        "spaAddonAmount"
      ),

    total_paid:
      num(
        "totalPaid"
      ),

    payment_date:
      document
        .getElementById(
          "paymentDate"
        )
        .value ||
      null,

    expiry_date:
      document
        .getElementById(
          "expiryDate"
        )
        .value ||
      null,

    bath_extra_amount:
      num(
        "bathExtraAmount"
      ),

    groom_extra_amount:
      num(
        "groomExtraAmount"
      ),

    shared_pass:
      document
        .getElementById(
          "sharedPass"
        )
        .checked,

    shared_pet_name:
      document
        .getElementById(
          "sharedPetName"
        )
        .value
        .trim(),

    total_uses:
      5,

    notes:
      document
        .getElementById(
          "passNotes"
        )
        .value
        .trim(),

    status:
      "active"
  };

  const {
    error
  } =
    await client
      .from("passes")
      .insert(row);

  if (error) {

    alert(
      "建立失敗：" +
      error.message
    );

    return;
  }

  alert(
    "建立成功"
  );

  [
    "ownerName",
    "phone",
    "petName",
    "breed",
    "passAmount",
    "stylingAddon",
    "stylingAddonAmount",
    "passAddonAmount",
    "spaAddonAmount",
    "totalPaid",
    "bathExtraAmount",

        document
          .getElementById(id)

  document
    .getElementById(
      "sharedPass"
    )
    .checked =

  document

      "paymentDate"
    )

    today();

  autoExpiry();

  await refreshData();

  showPage(
    "search",
    document
      .querySelectorAll(
        ".tab"
      )[0]
  );
}

  if (modal) modal.remove();
}


function updateEditTotal() {
  const number = id =>
    Number(document.getElementById(id)?.value || 0);

  const total =
    number("editPassAmount") +
    number("editStylingAddonAmount") +
    number("editPassAddonAmount") +
    number("editSpaAddonAmount");

  document.getElementById("editTotalPaid").value = total;
}


async function saveEditedPass() {
  if (!selectedPass) return;

  const value = id =>
    document.getElementById(id)?.value ?? "";

  const number = id =>
    Number(value(id) || 0);

  const updates = {
    owner_name: value("editOwnerName").trim(),
    phone: value("editPhone").trim(),
    pet_name: value("editPetName").trim(),
    breed: value("editBreed").trim(),

    pass_amount: number("editPassAmount"),

    styling_addon:
      value("editStylingAddon").trim(),

    styling_addon_amount:
      number("editStylingAddonAmount"),

    pass_addon_amount:
      number("editPassAddonAmount"),

    spa_addon_amount:
      number("editSpaAddonAmount"),

    total_paid:
      number("editTotalPaid"),

    bath_extra_amount:
      number("editBathExtraAmount"),

    groom_extra_amount:
      number("editGroomExtraAmount"),

    shared_pet_name:
      value("editSharedPetName").trim(),

    notes:
      value("editPassNotes").trim()
  };

  const saveButton =
    document.querySelector(
      '#editPassModal button[onclick="saveEditedPass()"]'
    );

  if (saveButton) {
    saveButton.disabled = true;
    saveButton.textContent = "儲存中...";
  }

  const passId = selectedPass.id;

  const { error } = await client
    .from("passes")
    .update(updates)
    .eq("id", passId);

  if (error) {
    alert("修改失敗：" + error.message);

    if (saveButton) {
      saveButton.disabled = false;
      saveButton.textContent = "儲存修改";
    }

    return;
  }

  await refreshData();

  selectedPass =
    passes.find(pass => pass.id === passId) ||
    selectedPass;

  closeEditPassModal();
  renderSelectedPass();

  alert("修改成功");
}
/* =========================
   開啟簽名
========================= */

function openUsage(
  redeemed
) {

  if (!selectedPass) {
    return;
  }

  if (
    redeemed &&
    getRemaining(
      selectedPass
    ) <= 0
  ) {

    alert(
      "此計次券已用完"
    );

    return;
  }

  document
    .getElementById(
      "usageModal"
    )
    .classList
    .remove("hidden");

  document
    .getElementById(
      "redeemedSelect"
    )
    .value =
    redeemed
      ? "true"
      : "false";

  document
    .getElementById(
      "serviceDate"
    )
    .value =
    today();

  document
    .getElementById(
      "serviceType"
    )
    .value =
    "洗澡";

  document
    .getElementById(
      "originalPrice"
    )
    .value =
    "";

  document
    .getElementById(
      "redeemAmount"
    )
    .value =
    "";

  document
    .getElementById(
      "operatorName"
    )
    .value =
    "";

  document
    .getElementById(
      "usageNotes"
    )
    .value =
    "";

  document
    .getElementById(
      "usagePassInfo"
    )
    .innerHTML = `

      <b>
        ${esc(
          selectedPass
            .pet_name
        )}
      </b>

      ｜

      ${esc(
        selectedPass
          .owner_name
      )}

      ｜剩餘

      ${getRemaining(
        selectedPass
      )}

      /

      ${totalUses(
        selectedPass
      )}

      次

      ｜到期

      ${
        selectedPass
          .expiry_date ||
        "-"
      }
    `;

  clearSignature();

  updateUsageMode();

  setTimeout(
    setupSignature,
    50
  );
}

function closeUsage() {

  document
    .getElementById(
      "usageModal"
    )
    .classList
    .add("hidden");

  clearSignature();
}


/* =========================
   補差額
========================= */

function updateUsageMode() {

  const redeemed =
    document
      .getElementById(
        "redeemedSelect"
      )
      .value ===
    "true";

  const redeemInput =
    document
      .getElementById(
        "redeemAmount"
      );

  redeemInput.disabled =
    !redeemed;

  if (!redeemed) {

    redeemInput.value =
      0;
  }

  autoExtraAmount();
}

function autoExtraAmount() {

  if (!selectedPass) {
    return;
  }

  const type =
    document
      .getElementById(
        "serviceType"
      )
      .value;

  let value =
    0;

  if (
    type ===
    "洗澡"
  ) {

    value =
      Number(
        selectedPass
          .bath_extra_amount ||
        0
      );
  }

  if (
    type ===
    "大美"
  ) {

    value =
      Number(
        selectedPass
          .groom_extra_amount ||
        0
      );
  }

  document
    .getElementById(
      "extraAmount"
    )
    .value =
    value;
}


/* =========================
   儲存本次消費
========================= */

async function saveUsage() {

  const redeemed =
    document
      .getElementById(
        "redeemedSelect"
      )
      .value ===
    "true";

  if (
    redeemed &&
    getRemaining(
      selectedPass
    ) <= 0
  ) {

    alert(
      "此計次券已無剩餘次數"
    );

    return;
  }

  if (!signatureHasInk) {

    alert(
      "請先請顧客簽名"
    );

    return;
  }

  const canvas =
    document
      .getElementById(
        "signatureCanvas"
      );

  const row = {

    pass_id:
      selectedPass.id,

    sequence_no:
      redeemed
        ? getUsedCount(
            selectedPass.id
          ) + 1
        : 0,

    service_date:
      document
        .getElementById(
          "serviceDate"
        )
        .value ||
      today(),

    service_type:
      document
        .getElementById(
          "serviceType"
        )
        .value,

    original_price:
      num(
        "originalPrice"
      ),

    redeem_amount:
      redeemed
        ? num(
            "redeemAmount"
          )
        : 0,

    extra_amount:
      num(
        "extraAmount"
      ),

    notes:
      document
        .getElementById(
          "usageNotes"
        )
        .value
        .trim(),

    signature:
      canvas
        .toDataURL(
          "image/png"
        ),

    operator_name:
      document
        .getElementById(
          "operatorName"
        )
        .value
        .trim(),

    voided:
      false,

    redeemed:
      redeemed,

    signed_at:
      new Date()
        .toISOString()
  };

  const {
    error
  } =
    await client
      .from(
        "transactions"
      )
      .insert(row);

  if (error) {

    alert(
      "儲存失敗：" +
      error.message
    );

    return;
  }

  alert(
    redeemed
      ? "已完成扣次與簽名"
      : "已保存本次未折抵消費與簽名"
  );

  closeUsage();

  await refreshData();
}


/* =========================
   紀錄
========================= */

function setRecordFilter(
  filter,
  button
) {

  recordFilter =
    filter;

  button
    .parentElement
    .querySelectorAll(
      ".chip"
    )
    .forEach(
      element => {

        element
          .classList
          .remove(
            "active"
          );
      }
    );

  button
    .classList
    .add("active");

  renderRecords();
}

function renderRecords() {

  const dateInput =
    document
      .getElementById(
        "recordDate"
      );

  if (!dateInput) {
    return;
  }

  const date =
    dateInput.value ||
    today();

  const keyword =
    document
      .getElementById(
        "recordSearch"
      )
      .value
      .trim()
      .toLowerCase();

  let list =
    transactions
      .filter(
        transaction =>
          !transaction.voided &&
          transaction
            .service_date ===
          date
      );

  list =
    list.filter(
      transaction => {

        const pass =
          passes.find(
            p =>
              p.id ===
              transaction
                .pass_id
          );

        const text = [
          pass?.pet_name,
          pass?.owner_name,
          pass?.phone,
          transaction.service_type,
          transaction.operator_name
        ]
          .join(" ")
          .toLowerCase();

        if (
          keyword &&
          !text.includes(
            keyword
          )
        ) {

          return false;
        }

        if (
          recordFilter ===
          "redeemed"
        ) {

          return (
            transaction
              .redeemed !==
            false
          );
        }

        if (
          recordFilter ===
          "notRedeemed"
        ) {

          return (
            transaction
              .redeemed ===
            false
          );
        }

        if (
          recordFilter ===
          "signed"
        ) {

          return !!transaction
            .signature;
        }

        if (
          recordFilter ===
          "unsigned"
        ) {

          return !transaction
            .signature;
        }

        return true;
      }
    );

  const box =
    document
      .getElementById(
        "recordsList"
      );

  const summary =
    document
      .getElementById(
        "recordSummary"
      );

  const dayAll =
    transactions
      .filter(
        transaction =>
          !transaction.voided &&
          transaction
            .service_date ===
          date
      );

  const signed =
    dayAll
      .filter(
        transaction =>
          !!transaction
            .signature
      )
      .length;

  const noRedeem =
    dayAll
      .filter(
        transaction =>
          transaction
            .redeemed ===
          false
      )
      .length;

  summary.textContent =
    `${date}｜共 ${dayAll.length} 筆｜已簽 ${signed}｜未簽 ${dayAll.length - signed}｜未折抵 ${noRedeem}`;

  if (!list.length) {

    box.innerHTML =
      '<div class="muted">這個條件沒有紀錄</div>';

    return;
  }

  box.innerHTML =
    list
      .map(
        transaction => {

          const pass =
            passes.find(
              p =>
                p.id ===
                transaction
                  .pass_id
            );

          return `
            <div class="record-row">

              <div class="record-head">

                <div>

                  <b>
                    ${esc(
                      pass?.pet_name ||
                      "未知毛孩"
                    )}
                  </b>

                  ・

                  ${esc(
                    pass?.owner_name ||
                    ""
                  )}

                </div>

                <div>

${
  transaction.signature
    ? '<span class="signed">已簽名</span>　<details style="display:inline-block"><summary style="color:#06c;text-decoration:underline;cursor:pointer">查看簽名</summary><img src="' + transaction.signature + '" style="display:block;max-width:280px;width:100%;margin-top:10px;border:1px solid #ddd;border-radius:8px;background:white;padding:8px"></details>'
    : '<span class="unsigned">未簽名</span>'
}

                </div>

              </div>

              <div class="muted">

                ${
                  transaction.redeemed ===
                  false
                    ? "未折抵"
                    : "第 " +
                      (
                        transaction.sequence_no ||
                        "-"
                      ) +
                      " 次折抵"
                }

                ｜

                ${esc(
                  transaction
                    .service_type ||
                  ""
                )}

                ｜補差
                $
                ${money(
                  transaction
                    .extra_amount
                )}

                ｜經手
                ${esc(
                  transaction
                    .operator_name ||
                  "-"
                )}

              </div>

              ${
                transaction.notes
                  ? `
                    <div class="muted">
                      備註：
                      ${esc(
                        transaction.notes
                      )}
                    </div>
                  `
                  : ""
              }

            </div>
          `;
        }
      )
      .join("");
}


/* =========================
   頁面切換
========================= */

function showPage(
  name,
  button
) {

  [
    "search",
    "create",
    "records"
  ]
    .forEach(
      pageName => {

        document
          .getElementById(
            pageName +
            "Page"
          )
          .classList
          .toggle(
            "hidden",
            pageName !==
            name
          );
      }
    );

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      element => {

        element
          .classList
          .remove("active");
      }
    );

  button
    .classList
    .add("active");

  if (
    name ===
    "records"
  ) {

    renderRecords();
  }
}


/* =========================
   簽名
========================= */

function setupSignature() {

  const canvas =
    document
      .getElementById(
        "signatureCanvas"
      );

  if (!canvas) {
    return;
  }

  const rect =
    canvas
      .getBoundingClientRect();

  if (!rect.width) {
    return;
  }

  const ratio =
    window.devicePixelRatio ||
    1;

  canvas.width =
    rect.width *
    ratio;

  canvas.height =
    320 *
    ratio;

  const context =
    canvas
      .getContext("2d");

  context.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  context.lineWidth =
    3;

  context.lineCap =
    "round";

  context.lineJoin =
    "round";

  context.strokeStyle =
    "#111";

  function point(event) {

    const canvasRect =
      canvas
        .getBoundingClientRect();

    const source =
      event.touches
        ? event.touches[0]
        : event;

    return {

      x:
        source.clientX -
        canvasRect.left,

      y:
        source.clientY -
        canvasRect.top
    };
  }

  function start(event) {

    event.preventDefault();

    drawing =
      true;

    signatureHasInk =
      true;

    const state =
      document
        .getElementById(
          "signatureState"
        );

    state.textContent =
      "已簽名";

    state.className =
      "signed";

    const p =
      point(event);

    context.beginPath();

    context.moveTo(
      p.x,
      p.y
    );
  }

  function move(event) {

    if (!drawing) {
      return;
    }

    event.preventDefault();

    const p =
      point(event);

    context.lineTo(
      p.x,
      p.y
    );

    context.stroke();
  }

  function end() {

    drawing =
      false;
  }

  canvas.onpointerdown =
    start;

  canvas.onpointermove =
    move;

  canvas.onpointerup =
    end;

  canvas.onpointerleave =
    end;

  canvas.ontouchstart =
    start;

  canvas.ontouchmove =
    move;

  canvas.ontouchend =
    end;
}

function clearSignature() {

  const canvas =
    document
      .getElementById(
        "signatureCanvas"
      );

  if (canvas) {

    const context =
      canvas
        .getContext("2d");

    context.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }

  signatureHasInk =
    false;

  const state =
    document
      .getElementById(
        "signatureState"
      );

  if (state) {

    state.textContent =
      "尚未簽名";

    state.className =
      "muted";
  }
}
