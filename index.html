<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>孩要有你｜電子計次券</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f4f1;
      --ink: #1f1f1f;
      --muted: #777;
      --line: #e6e6e2;
      --ok: #18733b;
      --warn: #8a6700;
      --danger: #a62d2d;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    .app {
      max-width: 760px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #171717;
      color: white;
      padding: 18px;
    }

    header h1 { margin: 0; font-size: 21px; }
    header p { margin: 4px 0 0; color: #bbb; font-size: 13px; }

    .page { padding: 14px; }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,.035);
    }

    h2, h3 { margin: 0 0 12px; }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      color: #666;
      font-size: 13px;
      margin: 10px 0 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8d8d4;
      border-radius: 12px;
      background: white;
      color: #222;
    }

    textarea {
      min-height: 74px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px 14px;
      margin-top: 10px;
      background: #222;
      color: white;
      font-weight: 800;
    }

    .btn:disabled { opacity: .55; }

    .btn.secondary {
      background: #efefec;
      color: #222;
    }

    .btn.danger { background: var(--danger); }

    .btn.small {
      width: auto;
      margin: 0;
      padding: 9px 11px;
      font-size: 13px;
    }

    .tabs {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      max-width: 760px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: white;
      border-top: 1px solid #ddd;
      z-index: 30;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tab {
      border: 0;
      background: white;
      padding: 13px 5px;
      color: #777;
    }

    .tab.active {
      color: #111;
      font-weight: 900;
    }

    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: #171717;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      margin: auto;
      background: white;
      border-radius: 22px;
      padding: 26px 20px;
    }

    .login-box h1 { margin: 0 0 4px; }

    .error {
      color: var(--danger);
      font-size: 13px;
    }

    .searchbar {
      position: sticky;
      top: 82px;
      background: var(--bg);
      z-index: 12;
      padding-bottom: 8px;
    }

    .searchbox {
      font-size: 17px;
      padding: 14px;
      border: 2px solid #222;
    }

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 8px 0 2px;
    }

    .chip {
      border: 1px solid #d3d3cf;
      background: white;
      border-radius: 999px;
      padding: 8px 11px;
      white-space: nowrap;
    }

    .chip.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .pass-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .pass-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .pet {
      font-size: 20px;
      font-weight: 900;
    }

    .owner { font-weight: 700; }

    .status {
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 999px;
      background: #eee;
      white-space: nowrap;
    }

    .status.active {
      background: #dff4e5;
      color: var(--ok);
    }

    .status.soon {
      background: #fff0bf;
      color: var(--warn);
    }

    .status.expired,
    .status.completed,
    .status.voided {
      background: #f9dddd;
      color: var(--danger);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .summary > div {
      background: #f6f6f3;
      border-radius: 12px;
      padding: 10px;
    }

    .summary b {
      display: block;
      font-size: 18px;
    }

    .paper {
      border: 2px solid #333;
      border-radius: 22px;
      padding: 16px;
      background: white;
    }

    .paper-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 18px;
    }

    @media (max-width: 560px) {
      .paper-grid { grid-template-columns: 1fr; }
    }

    .paper-row {
      font-size: 14px;
      border-bottom: 1px dashed #ccc;
      padding: 7px 0;
    }

    .rules {
      margin: 12px 0 0;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.55;
    }

    .history-row {
      border-top: 1px dashed #bbb;
      padding: 12px 0;
    }

    .history-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
    }

    .gift { color: #8a5b00; }

    .signature-wrap {
      border: 2px solid #333;
      background: white;
      border-radius: 14px;
      overflow: hidden;
    }

    #signatureCanvas {
      width: 100%;
      height: 320px;
      display: block;
      touch-action: none;
      background: white;
    }

    .signature-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px;
      border-top: 1px solid #ddd;
    }

    .notice {
      padding: 11px;
      border-radius: 12px;
      background: #fff3c9;
      color: #655000;
      font-size: 13px;
      margin: 10px 0;
    }

    .void-notice {
      padding: 12px;
      border-radius: 12px;
      background: #f9dddd;
      color: var(--danger);
      font-size: 13px;
      margin: 10px 0;
      font-weight: 700;
    }

    .record-row {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .record-row:last-child { border-bottom: 0; }

    .record-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .signed {
      color: var(--ok);
      font-weight: 800;
    }

    .unsigned {
      color: var(--danger);
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top-actions .btn { margin: 0; }
    #usageModal .grid > div { min-width: 0; }
    #usageModal .signature-footer { flex-wrap: wrap; }
    .record-head { flex-wrap: wrap; }
    @media (orientation: landscape) and (max-height: 600px) {
      #signatureCanvas { height: clamp(140px, 48dvh, 240px); }
      #usageModal .card { padding: 12px; }
    }
  </style>
</head>

<body>

<div id="loginScreen" class="login">
  <div class="login-box">
    <h1>孩要有你</h1>
    <p class="muted">電子計次券</p>

    <label>登入 Email</label>
    <input id="loginEmail" type="email" autocomplete="username">

    <label>密碼</label>
    <input id="loginPassword" type="password" autocomplete="current-password">

    <button id="loginButton" class="btn" type="button">
      登入系統
    </button>

    <button id="signupButton" class="btn secondary" type="button">
      註冊新帳號
    </button>

    <p id="loginMessage" class="muted"></p>
  </div>
</div>

<div id="mainApp" class="app hidden">

  <header>
    <h1>孩要有你｜電子計次券</h1>
    <p id="loginUser"></p>
  </header>

  <main>

    <section id="searchPage" class="page">

      <div class="searchbar">

        <input
          id="quickSearch"
          class="searchbox"
          placeholder="搜尋毛孩、飼主、電話、犬種"
          oninput="scheduleSearch()"
        >

        <div class="filters">

          <button class="chip active" data-filter="active"
            onclick="setPassFilter('active', this)">
            有效
          </button>

          <button class="chip" data-filter="all"
            onclick="setPassFilter('all', this)">
            全部
          </button>

          <button class="chip" data-filter="soon"
            onclick="setPassFilter('soon', this)">
            7天內到期
          </button>

          <button class="chip" data-filter="expired"
            onclick="setPassFilter('expired', this)">
            已到期
          </button>

          <button class="chip" data-filter="completed"
            onclick="setPassFilter('completed', this)">
            已用完
          </button>

          <button class="chip" data-filter="voided"
            onclick="setPassFilter('voided', this)">
            已作廢
          </button>

        </div>
      </div>

      <div id="selectedPassPanel" class="hidden"></div>
      <div id="searchResults"></div>

    </section>

    <section id="createPage" class="page hidden">

      <div class="card">

        <h2>建立電子計次券</h2>
        <div id="copyPassNotice" class="notice hidden" role="status"></div>

        <div class="grid">

          <div>
            <label>飼主姓名</label>
            <input id="ownerName">
          </div>

          <div>
            <label>電話</label>
            <input id="phone" type="tel">
          </div>

          <div>
            <label>毛孩名字</label>
            <input id="petName">
          </div>

          <div>
            <label>犬種</label>
            <input id="breed">
          </div>

          <div>
            <label>計次券金額</label>
            <input id="passAmount" type="number">
          </div>

          <div>
            <label>加購造型</label>
            <input id="stylingAddon">
          </div>

          <div>
            <label>加購造型金額</label>
            <input id="stylingAddonAmount" type="number">
          </div>

          <div>
            <label>計次券加購</label>
            <input id="passAddonAmount" type="number">
          </div>

          <div>
            <label>SPA 加購</label>
            <input id="spaAddonAmount" type="number">
          </div>

          <div>
            <label>總金額</label>
            <input id="totalPaid" type="number" readonly>
          </div>

          <div>
            <label>付款日</label>
            <input id="paymentDate" type="date" onchange="autoExpiry()">
          </div>

          <div>
            <label>使用期限</label>
            <input id="expiryDate" type="date">
            <label><input id="buyAhead" type="checkbox" style="width:auto" onchange="autoExpiry()"> 先買券，首次折抵時啟用</label>
            <p class="muted">勾選後不從付款日計期限；首次折抵起算一般45天／共用25天。</p>
          </div>

          <div>
            <label>洗澡差額</label>
            <input id="bathExtraAmount" type="number">
          </div>

          <div>
            <label>大美差額</label>
            <input id="groomExtraAmount" type="number">
          </div>

        </div>

        <label>
          <input
            id="sharedPass"
            type="checkbox"
            style="width:auto"
            onchange="autoExpiry()"
          >
          同價位兩隻毛孩共用（期限25天）
        </label>

        <label>另一隻毛孩名字</label>
        <input id="sharedPetName">

        <label>備註</label>
        <textarea id="passNotes"></textarea>

        <div class="notice">
          可先收款買券，建立時不扣次數；到店使用時再新增折抵與簽名紀錄。<br>使用期限預設從付款日起算：一般45天、共用25天，可自行修改。第5次為贈送。
        </div>

        <button id="createPassButton" class="btn" type="button" onclick="createPass()">
          收款並建立計次券（不扣次數）
        </button>

      </div>
    </section>

    <section id="recordsPage" class="page hidden">

      <div class="card">

        <h2>消費／簽名紀錄</h2>

        <div class="grid">

          <div>
            <label>日期</label>
            <input id="recordDate" type="date" onchange="renderRecords()">
          </div>

          <div>
            <label>搜尋</label>
            <input
              id="recordSearch"
              placeholder="毛孩、飼主、電話"
              oninput="renderRecords()"
            >
          </div>

        </div>

        <div class="filters">

          <button class="chip active"
            onclick="setRecordFilter('all', this)">
            全部
          </button>

          <button class="chip"
            onclick="setRecordFilter('redeemed', this)">
            有折抵
          </button>

          <button class="chip"
            onclick="setRecordFilter('notRedeemed', this)">
            未折抵
          </button>

          <button class="chip"
            onclick="setRecordFilter('signed', this)">
            已簽名
          </button>

          <button class="chip"
            onclick="setRecordFilter('unsigned', this)">
            未簽名
          </button>
          <button class="chip" onclick="setRecordFilter('voided', this)">已作廢紀錄</button>

        </div>

      </div>

      <div class="card">
        <div id="recordSummary" class="muted"></div>
        <div id="recordsList"></div>
      </div>

      <button class="btn danger" type="button" onclick="logout()">
        登出
      </button>

    </section>

  </main>

  <nav class="tabs">

    <button class="tab active" onclick="showPage('search', this)">
      查券／簽名
    </button>

    <button class="tab" onclick="showPage('create', this)">
      開券
    </button>

    <button class="tab" onclick="showPage('records', this)">
      紀錄
    </button>

  </nav>

</div>

<div id="usageModal" class="hidden">

  <div style="
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    padding:12px;
    overflow:auto;
  ">

    <div style="
      max-width:700px;
      margin:20px auto;
      background:#f5f5f3;
      border-radius:20px;
      padding:14px;
    ">

      <div class="top-actions">
        <button class="btn secondary" type="button" onclick="closeUsage()">
          返回
        </button>
      </div>

      <div class="card">

        <h2 id="usageTitle">本次消費</h2>

        <div id="usagePassInfo" class="notice"></div>

        <div class="grid">

          <div>
            <label>日期</label>
            <input id="serviceDate" type="date">
          </div>

          <div>
            <label>本次是否折抵計次券</label>
            <select id="redeemedSelect" onchange="updateUsageMode()">
              <option value="true">有折抵</option>
              <option value="false">本次消費但不折抵</option>
            </select>
          </div>

          <div>
            <label>服務項目</label>
            <select id="serviceType" onchange="autoExtraAmount()">
              <option value="洗澡">洗澡</option>
              <option value="大美">大美容（折抵1次，取消贈次）</option>
              <option value="SPA">SPA</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div>
            <div id="groomUsageHint" class="muted" aria-live="polite"></div>
            <label>本次服務原價</label>
            <input id="originalPrice" type="number">
          </div>

          <div>
            <label>本次扣抵金額</label>
            <input id="redeemAmount" type="number">
          </div>

          <div>
            <label>補差額</label>
            <input id="extraAmount" type="number" value="0">
          </div>

          <div>
            <label>經手人員</label>
            <input id="operatorName">
          </div>

        </div>

        <label>備註</label>
        <textarea id="usageNotes"></textarea>

        <label style="font-size:16px;font-weight:800">
          顧客簽名
        </label>

        <div class="signature-wrap">

          <canvas id="signatureCanvas"></canvas>

          <div class="signature-footer">

            <span id="signatureState" class="muted">
              尚未簽名
            </span>

            <button
              class="btn small secondary"
              type="button"
              onclick="clearSignature()"
            >
              清除重簽
            </button>

          </div>

        </div>

        <button class="btn" type="button" id="saveUsageButton" onclick="saveUsage()">
          儲存本次紀錄
        </button>
        <button class="btn secondary" type="button" id="remoteUsageButton" onclick="saveRemoteUsage()">儲存並產生手機簽名連結</button>
        <p class="muted">傳連結模式：確認儲存就登錄本次扣次，狀態為「待簽名」；客人簽名不會再扣次。若不使用本次紀錄，需由員工作廢回復。</p>

      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL =
  "https://kytdrgmwyupjzjdyjhjh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ZEoEcNmr5dMoZtIEGdPCfA_ffav8l9O";

let client = null;
let passes = [];
let transactions = [];
let selectedPass = null;
let passFilter = "active";
let recordFilter = "all";
let drawing = false;
let signatureHasInk = false;
let editingTransactionId = null;
let signatureStrokes = [];
let signatureObserver = null;
let usageSaving = false;
let passCreating = false;
let remoteOperationId = null;
let remoteLinkTimer = null;
let dataRefreshPromise = null;
let indexedTransactions = null;
let transactionsByPass = new Map();
let searchTimer = null;
let searchLimit = 50;
let searchKey = "";
let recordLimit = 50;
let recordKey = "";
const signatureImageCache = new Map();
const REMOTE_API = SUPABASE_URL + "/functions/v1/remote-signature";

function today() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function money(value) {
  return Number(value || 0).toLocaleString("zh-TW");
}

function num(id) {
  return Number(document.getElementById(id)?.value || 0);
}

function addDays(dateString, days) {
  if (!dateString) return "";

  const [y, m, d] = dateString.split("-").map(Number);
  const date = new Date(y, m - 1, d);

  date.setDate(date.getDate() + days);

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function daysUntil(dateString) {
  if (!dateString) return 9999;

  const a = new Date(today() + "T00:00:00");
  const b = new Date(dateString + "T00:00:00");

  return Math.ceil((b - a) / 86400000);
}

async function init() {
  const message = document.getElementById("loginMessage");

  try {
    if (!window.supabase) {
      throw new Error("Supabase 載入失敗，請重新整理頁面");
    }

    client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    document.getElementById("paymentDate").value = today();
    document.getElementById("serviceDate").value = today();
    document.getElementById("recordDate").value = today();

    autoExpiry();

    const { data, error } = await client.auth.getSession();

    if (error) throw error;

    if (data?.session?.user) {
      await openApp(data.session.user);
    }
  } catch (error) {
    message.textContent =
      "系統初始化失敗：" +
      (error?.message || String(error));

    message.className = "error";
  }
}

async function login() {
  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const button =
    document.getElementById("loginButton");

  const message =
    document.getElementById("loginMessage");

  if (!client) {
    message.textContent =
      "系統尚未完成載入，請重新整理頁面後再試一次";
    message.className = "error";
    return;
  }

  if (!email || !password) {
    message.textContent = "請輸入 Email 與密碼";
    message.className = "error";
    return;
  }

  button.disabled = true;
  button.textContent = "登入中...";

  message.textContent = "正在登入...";
  message.className = "muted";

  try {
    const { data, error } =
      await client.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    if (!data?.user) {
      throw new Error("登入資料異常");
    }

    message.textContent = "";
    await openApp(data.user);

  } catch (error) {
    message.textContent =
      "登入失敗：" +
      (error?.message || String(error));

    message.className = "error";

  } finally {
    button.disabled = false;
    button.textContent = "登入系統";
  }
}

async function signup() {
  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  const button =
    document.getElementById("signupButton");

  if (!client) {
    message.textContent =
      "系統尚未完成載入，請重新整理頁面後再試一次";
    message.className = "error";
    return;
  }

  if (!email || !password) {
    message.textContent = "請輸入 Email 與密碼";
    message.className = "error";
    return;
  }

  if (password.length < 6) {
    message.textContent = "密碼至少需要 6 個字元";
    message.className = "error";
    return;
  }

  button.disabled = true;
  button.textContent = "註冊中...";

  try {
    const { data, error } =
      await client.auth.signUp({
        email,
        password
      });

    if (error) throw error;

    if (data?.session) {
      message.textContent =
        "註冊成功，正在登入...";
      message.className = "muted";

      await openApp(data.user);
      return;
    }

    message.textContent =
      "註冊成功！請到 Email 收驗證信，驗證完成後再回來登入。";
    message.className = "muted";

  } catch (error) {
    message.textContent =
      "註冊失敗：" +
      (error?.message || String(error));

    message.className = "error";

  } finally {
    button.disabled = false;
    button.textContent = "註冊新帳號";
  }
}

async function logout() {
  if (client) {
    await client.auth.signOut();
  }

  location.reload();
}

async function openApp(user) {
  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("mainApp")
    .classList.remove("hidden");

  document.getElementById("loginUser").textContent =

    );

}

async function readAllLightweight(table, passId = null) {
  const rows = [];
  for (let offset = 0; ; offset += 500) {
    let query = client.from(table).select("*")
      .order("created_at", {ascending:false}).order("id", {ascending:false});
    if (passId) query = query.eq("pass_id", passId);
    const {data,error} = await query.range(offset, offset + 499);
    if (error) throw new Error("資料讀取失敗：" + error.message);
    rows.push(...(data || []));
    if (!data || data.length < 500) return rows;
  }
}

async function refreshData() {
  if (dataRefreshPromise) return dataRefreshPromise;
  dataRefreshPromise = refreshLightweightData();
  try { await dataRefreshPromise; }
  finally { dataRefreshPromise = null; }
}

async function refreshLightweightData() {
  const [nextPasses,nextTransactions] = await Promise.all([
    readAllLightweight("passes"), readAllLightweight("transaction_summaries")
  ]);
  passes = nextPasses;
  transactions = nextTransactions;
  signatureImageCache.clear();

  renderSearchResults();
  renderRecords();

  if (selectedPass) {
    selectedPass =
      passes.find(
        p => p.id === selectedPass.id
      ) || selectedPass;

    renderSelectedPass();
  }
}

function usedTransactions(passId) {
  if (indexedTransactions !== transactions) {
    transactionsByPass = new Map();
    for (const t of transactions) {
      if (t.voided || t.redeemed === false) continue;
      if (!transactionsByPass.has(t.pass_id)) transactionsByPass.set(t.pass_id,[]);
      transactionsByPass.get(t.pass_id).push(t);
    }
    indexedTransactions = transactions;
  }
  return transactionsByPass.get(passId) || [];
}

function hasSignature(record) {
  return record?.has_signature ?? !!record?.signature;
}

async function loadSignatureImage(details, id) {
  if (!details.open || details.dataset.loading === "true" || details.dataset.loaded === "true") return;
  const box = details.querySelector(".signature-image");
  details.dataset.loading = "true";
  box.textContent = "簽名載入中…";
  const record = transactions.find(t => t.id === id);
  const key = id + "|" + (record?.signed_at || "");
  try {
    let image = signatureImageCache.get(key);
    if (!image) {
      const {data,error} = await client.from("transactions").select("signature,signed_at").eq("id",id).single();
      if (error) throw error;
      if (!data?.signature) throw new Error("尚未收到簽名，請重新整理紀錄");
      if (!/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(data.signature)) throw new Error("簽名格式無法顯示，請聯絡店主");
      image = data.signature;
      if (data.signed_at === record?.signed_at) {
        if (signatureImageCache.size >= 12) signatureImageCache.delete(signatureImageCache.keys().next().value);
        signatureImageCache.set(key,image);
      }
    }
    const img = document.createElement("img");
    img.alt = "顧客簽名";
    img.style.cssText = "display:block;max-width:280px;width:100%;margin-top:10px;border:1px solid #ddd;border-radius:8px;background:white;padding:8px";
    img.src = image;
    box.replaceChildren(img);
    details.dataset.loaded = "true";
  } catch(error) {
    box.textContent = "載入失敗：" + (error.message || "請重試") + "。關閉後再點開可重試。";
  } finally { details.dataset.loading = "false"; }
}

function scheduleSearch() {
  clearTimeout(searchTimer);

// Persist the new rule in the existing notes field; historical records retain their original accounting.
const GROOM_RULE = "【大美容折抵1次，取消贈次】";
function isGroomRedemption(transaction) {
  return transaction.service_type === "大美" && transaction.redeemed !== false &&
    [GROOM_RULE, "【大美容折抵2次，取消贈次】"].some(rule => String(transaction.notes || "").startsWith(rule));
}
function usageUnits(transaction) {
  return 1;
}
function giftCancelled(passId) {
  return usedTransactions(passId).some(isGroomRedemption);
}
function getUsedCount(passId) {
  return usedTransactions(passId).reduce((sum, t) => sum + usageUnits(t), 0);
}
function totalUses(pass) {
  return Math.max(0, Number(pass.total_uses || 5) - (giftCancelled(pass.id) ? 1 : 0));
}

function getRemaining(pass) {
  return Math.max(
    0,
    totalUses(pass) -
      getUsedCount(pass.id)
  );
}

function getPassStatus(pass) {
  if (pass.voided) {
    return "voided";
  }

  if (pass.status === "archived") {
    return "archived";
  }

  if (getRemaining(pass) <= 0) {
    return "completed";
  }

  if (!pass.expiry_date && getUsedCount(pass.id) === 0) return "pending";

  const days =
    daysUntil(pass.expiry_date);

  if (days < 0) {
    return "expired";
  }

  if (days <= 7) {
    return "soon";
  }

  return "active";
}

function statusText(status) {
  return {
    active: "有效",
    pending: "已購買・待啟用",
    soon: "7天內到期",
    expired: "已到期",
    completed: "已用完",
    voided: "已作廢",
    archived: "已封存"
  }[status] || status;
}

function setPassFilter(filter, button) {

  document
    .querySelectorAll("[data-filter]")

function renderSearchResults() {
  const searchBox =
    document.getElementById("quickSearch");

  if (!searchBox) return;

  const keyword =
    searchBox.value.trim().toLowerCase();
  const key = passFilter + "|" + keyword;
  if (key !== searchKey) { searchKey = key; searchLimit = 50; }

  const list =
    passes.filter(pass => {
      const text = [
        pass.pet_name,
        pass.owner_name,
        pass.phone,
        pass.breed,
        pass.shared_pet_name
      ]
        .join(" ")
        .toLowerCase();

      if (
        keyword &&
        !text.includes(keyword)
      ) {
        return false;
      }

      const status =
        getPassStatus(pass);

      if (passFilter === "all") {
        return true;
      }

      if (passFilter === "active") {
        return (
          status === "active" ||
          status === "soon" || status === "pending"
        );
      }

      return status === passFilter;
    });

  const box =
    document.getElementById("searchResults");

  if (!list.length) {
    box.innerHTML =
      '<div class="card muted">找不到符合的計次券</div>';
    return;
  }

  box.innerHTML =
    list.slice(0,searchLimit).map(pass => {
      const status =
        getPassStatus(pass);

      const remaining =
        getRemaining(pass);

      return `
        <div
          class="pass-card"
          onclick="selectPass('${pass.id}')"
        >

          <div class="pass-top">

            <div>
              <div class="pet">
                ${esc(pass.pet_name || "")}
              </div>

              <div class="owner">
                ${esc(pass.owner_name || "")}
                ・
                ${esc(pass.phone || "")}
              </div>

              <div class="muted">
                ${esc(pass.breed || "")}
                ${
                  pass.shared_pass
                    ? " ・ 共用券"
                    : ""
                }
              </div>
            </div>

            <span class="status ${status}">
              ${statusText(status)}
            </span>

          </div>

          <div class="summary">

            <div>
              <span class="muted">剩餘</span>
              <b>
                ${remaining}/${totalUses(pass)}

            </div>

            <div>
              <span class="muted">到期</span>

}

function copySelectedPass() {
  if (!selectedPass || passCreating) return;
  const draftFields = ["ownerName", "phone", "petName", "breed", "passAmount", "stylingAddon", "stylingAddonAmount", "passAddonAmount", "spaAddonAmount", "totalPaid", "bathExtraAmount", "groomExtraAmount", "sharedPetName", "passNotes"];
  if ((draftFields.some(id => document.getElementById(id).value !== "") ||
      document.getElementById("sharedPass").checked || document.getElementById("buyAhead").checked) &&
      !confirm("開券頁已有未儲存資料，要以這位客人的資料重新填寫嗎？")) return;

  const source = selectedPass;
  draftFields.forEach(id => { document.getElementById(id).value = ""; });
  // Whitelist customer/pet fields only. Never copy IDs, money, usage or signatures.
  const values = {ownerName: source.owner_name, phone: source.phone, petName: source.pet_name, breed: source.breed, sharedPetName: source.shared_pass ? source.shared_pet_name : ""};
  Object.entries(values).forEach(([id, value]) => {
    document.getElementById(id).value = value ?? "";
  });
  document.getElementById("sharedPass").checked = !!source.shared_pass;
  document.getElementById("buyAhead").checked = false;
  document.getElementById("paymentDate").value = today();
  autoExpiry();
  const notice = document.getElementById("copyPassNotice");
  notice.textContent = `已帶入 ${source.owner_name || ""}／${source.pet_name || ""} 的客人與毛孩資料，尚未建立新券。請確認共用設定、付款日、期限及本次金額；舊券紀錄與簽名不會複製。`;
  notice.classList.remove("hidden");
  showPage("create", document.querySelectorAll(".tab")[1]);
  document.getElementById("createPage").scrollIntoView({block: "start"});
  document.getElementById("passAmount").focus({preventScroll: true});
}

function autoExpiry() {
  const pending = document.getElementById("buyAhead").checked;
  document.getElementById("expiryDate").disabled = pending;
  if (pending) { document.getElementById("expiryDate").value = ""; return; }
  const payment =
    document.getElementById(
      "paymentDate"
    ).value;

  const shared =
    document.getElementById(
      "sharedPass"
    ).checked;

  document.getElementById(
    "expiryDate"
  ).value =
    addDays(
      payment,
      shared ? 25 : 45
    );
}

function autoTotalPaid() {
  const total =
    (Number(document.getElementById("passAmount").value) || 0) +
    (Number(document.getElementById("stylingAddonAmount").value) || 0) +
    (Number(document.getElementById("passAddonAmount").value) || 0) +
    (Number(document.getElementById("spaAddonAmount").value) || 0);

  document.getElementById(
    "totalPaid"
  ).value =
    total === 0 ? "" : total;
}

async function createPass() {
  if (passCreating) return;
  passCreating = true;
  const button = document.getElementById("createPassButton");
  button.disabled = true;
  try {
    await persistNewPass();
  } catch (error) {
    alert("開券處理發生錯誤，請先查券確認是否已建立，再決定是否重試：" + (error.message || String(error)));
  } finally {
    passCreating = false;
    button.disabled = false;
  }
}

async function persistNewPass() {
  const owner =
    document.getElementById(
      "ownerName"
    ).value.trim();

  const pet =
    document.getElementById(
      "petName"
    ).value.trim();

  if (!owner || !pet) {
    alert("請填飼主姓名與毛孩名字");
    return;
  }

  const paymentDate = document.getElementById("paymentDate").value;
  const expiryDate = document.getElementById("buyAhead").checked ? "" : document.getElementById("expiryDate").value;
  if (paymentDate && expiryDate && expiryDate < paymentDate) {
    alert("使用期限不能早於付款日，請確認日期");
    return;
  }

  const row = {
    owner_name: owner,

    phone:
      document.getElementById(
        "phone"
      ).value.trim(),

    pet_name: pet,

    breed:
      document.getElementById(
        "breed"
      ).value.trim(),

    pass_amount:
      num("passAmount"),

    styling_addon:
      document.getElementById(
        "stylingAddon"
      ).value.trim(),

    styling_addon_amount:
      num("stylingAddonAmount"),

    pass_addon_amount:
      num("passAddonAmount"),

    spa_addon_amount:
      num("spaAddonAmount"),

    total_paid:
      num("totalPaid"),

    payment_date:
      document.getElementById(
        "paymentDate"
      ).value || null,

    expiry_date:
      expiryDate || null,

    bath_extra_amount:
      num("bathExtraAmount"),

    groom_extra_amount:
      num("groomExtraAmount"),

    shared_pass:
      document.getElementById(
        "sharedPass"
      ).checked,

    shared_pet_name:
      document.getElementById(
        "sharedPetName"
      ).value.trim(),

    total_uses: 5,

    notes:
      document.getElementById(
        "passNotes"
      ).value.trim(),

    status: "active"
  };

  const { error } =
    await client
      .from("passes")
      .insert(row);

  if (error) {
    alert(
      "建立失敗：" +
      error.message
    );
    return;
  }

  alert(document.getElementById("buyAhead").checked ? "預購券建立成功，尚未扣次；首次折抵時開始計算期限。" : "買券建立成功，尚未扣次數。到店使用時再新增折抵與簽名紀錄。");
  document.getElementById("buyAhead").checked = false;
  document.getElementById("copyPassNotice").classList.add("hidden");

  [
    "ownerName",
    "phone",
    "petName",
    "breed",
    "passAmount",
    "stylingAddon",
    "stylingAddonAmount",
    "passAddonAmount",
    "spaAddonAmount",
    "totalPaid",
    "bathExtraAmount",
    "groomExtraAmount",
    "sharedPetName",
    "passNotes"
  ].forEach(id => {
    document.getElementById(id).value = "";
  });

  document.getElementById(
    "sharedPass"
  ).checked = false;

  document.getElementById(
    "paymentDate"
  ).value = today();

  autoExpiry();

  await refreshData();

  showPage(
    "search",
    document.querySelectorAll(".tab")[0]
  );
}

async function saveEditedPass() {
  if (!selectedPass) return;

  if (selectedPass.voided) {
    alert("此計次券已作廢，不能修改");
    closeEditPassModal();
    return;
  }

  const value = id =>
    document.getElementById(id)?.value ?? "";

  const number = id =>
    Number(value(id) || 0);

  const paymentDate = value("editPaymentDate");
  const expiryDate = value("editExpiryDate");
  if (paymentDate && expiryDate && expiryDate < paymentDate) {
    alert("使用期限不能早於付款日，請確認日期");
    return;
  }

  if (!expiryDate && getUsedCount(selectedPass.id) > 0) {
    alert("已使用的券請填使用期限，不能改回待啟用"); return;
  }

  const updates = {
    payment_date: paymentDate || null,
    expiry_date: expiryDate || null,
    owner_name:
      value("editOwnerName").trim(),

    phone:
      value("editPhone").trim(),

    pet_name:
      value("editPetName").trim(),

    breed:
      value("editBreed").trim(),

    pass_amount:
      number("editPassAmount"),

    styling_addon:
      value("editStylingAddon").trim(),

    styling_addon_amount:
      number("editStylingAddonAmount"),

    pass_addon_amount:
      number("editPassAddonAmount"),

    spa_addon_amount:
      number("editSpaAddonAmount"),

    total_paid:
      number("editTotalPaid"),

    bath_extra_amount:
      number("editBathExtraAmount"),

    groom_extra_amount:
      number("editGroomExtraAmount"),

    shared_pet_name:
      value("editSharedPetName").trim(),

    notes:
      value("editPassNotes").trim()
  };

  const saveButton =
    document.querySelector(
      '#editPassModal button[onclick="saveEditedPass()"]'
    );

  if (saveButton) {
    saveButton.disabled = true;
    saveButton.textContent = "儲存中...";
  }

  const passId =
    selectedPass.id;

  const { error } =
    await client
      .from("passes")
      .update(updates)
      .eq("id", passId);

  if (error) {
    alert(
      "修改失敗：" +
      error.message
    );

    if (saveButton) {
      saveButton.disabled = false;
      saveButton.textContent = "儲存修改";
    }

    return;
  }

  await refreshData();

  selectedPass =
    passes.find(
      pass => pass.id === passId
    ) || selectedPass;

  closeEditPassModal();
  renderSelectedPass();

  alert("修改成功");
}

async function voidSelectedPass() {
  if (!selectedPass) return;

  if (selectedPass.voided) {
    alert("此計次券已經作廢");
    return;
  }

  const confirmed =
    confirm(
      `確定要作廢「${selectedPass.pet_name || ""}」的計次券嗎？\n\n作廢後將不能再折抵或新增消費紀錄，但歷史簽名與消費紀錄都會保留。`
    );

  if (!confirmed) return;

  const reason =
    prompt(
      "請輸入作廢原因，例如：退款、開錯、重複建立"
    );

  if (reason === null) return;

  if (!reason.trim()) {
    alert("請填寫作廢原因");
    return;
  }

  const passId =
    selectedPass.id;

  const { error } =
    await client
      .from("passes")
      .update({
        voided: true,
        void_reason: reason.trim(),
        voided_at:
          new Date().toISOString()
      })
      .eq("id", passId);

  if (error) {
    alert(
      "作廢失敗：" +
      error.message
    );
    return;
  }

  await refreshData();

  selectedPass =
    passes.find(
      pass => pass.id === passId
    ) || selectedPass;

  renderSelectedPass();

  alert("此計次券已作廢");
}

function autoExtraAmount() {
  if (!selectedPass) return;
  const groom = document.getElementById("serviceType").value === "大美";
  const redeemed = document.getElementById("redeemedSelect").value === "true";
  document.getElementById("groomUsageHint").textContent = editingTransactionId
    ? "重簽保留原紀錄的扣次規則"
    : groom && redeemed ? "顧客簽名一次，折抵1次；此券贈送的一次將取消。" : "本次" + (redeemed ? "折抵1次" : "不折抵，不取消贈次");

    document.getElementById(
      "serviceType"
    ).value;

async function saveUsage() {
  if (usageSaving) return;
  usageSaving = true;
  const button = document.getElementById("saveUsageButton");
  button.disabled = true;
  try {
    await persistUsage();
  } catch (error) {
    alert("儲存失敗：" + (error.message || String(error)));
  } finally {
    usageSaving = false;
    button.disabled = false;
  }
}

async function persistUsage() {
  if (editingTransactionId) {
    if (!signatureHasInk) return alert("請先請顧客重新簽名");
    const record = transactions.find(t => t.id === editingTransactionId);
    if (!record || record.voided) return alert("此紀錄已無法更正，請重新整理");
    const stamp = new Date().toISOString();
    const correctionQuery = client.from("transactions").update({
      signature: document.getElementById("signatureCanvas").toDataURL("image/png"),
      signed_at: stamp,
      notes: (record.notes || "") + "\n[簽名更正 " + stamp + "] 原簽名已由顧客重簽"
    }).eq("id", record.id).eq("voided", false);
    const { data, error } = await withSignedAtMatch(correctionQuery, record.signed_at).select("id");
    if (error) return alert("重簽儲存失敗：" + error.message);
    if (!data?.length) return alert("紀錄已被其他裝置更動，請重新整理後再試");
    usageSaving = false;
    closeUsage();
    await refreshData();
    return alert("已更新簽名，扣次與金額保持原紀錄");
  }
  if (!selectedPass) {
    alert("找不到計次券，請返回重新選擇");
    return;
  }

  const passId = selectedPass.id;

  /* 儲存前重新確認資料庫狀態，避免其他裝置剛好已將此券作廢 */
  const latestPassResult = await client
    .from("passes")
    .select("voided,status,expiry_date")
    .eq("id", passId)
    .single();

  if (latestPassResult.error) {
    alert("無法確認計次券狀態：" + latestPassResult.error.message);
    return;
  }

  if (latestPassResult.data?.voided || latestPassResult.data?.status === "voided") {
    closeUsage();
    await refreshData();
    alert("此計次券已作廢，不能新增消費紀錄。");
    return;
  }

  const redeemed = document.getElementById("redeemedSelect").value === "true";

  const groomRedemption = redeemed && document.getElementById("serviceType").value === "大美";
  if (redeemed) {
    const latestUsage = await readAllLightweight("transaction_summaries", passId);
    transactions = transactions.filter(t => t.pass_id !== passId).concat(latestUsage);
    const available = (groomRedemption ? Math.max(0, Number(selectedPass.total_uses || 5) - 1) : totalUses(selectedPass)) - getUsedCount(passId);
    if (available < 1) {
      alert(groomRedemption ? "取消贈次後不足1次，無法折抵大美容；請選擇本次不折抵。" : "此計次券已無剩餘次數");
      return;
    }
  }

  if (!signatureHasInk) {
    alert("請先請顧客簽名");
    return;
  }

  const activateOnSave = redeemed && !latestPassResult.data.expiry_date && getUsedCount(passId) === 0;
  const canvas = document.getElementById("signatureCanvas");
  const row = {
    pass_id: passId,
    sequence_no: redeemed ? Math.max(0, ...transactions.filter(t => t.pass_id === passId).map(t => Number(t.sequence_no) || 0)) + 1 : 0,
    service_date: document.getElementById("serviceDate").value || today(),
    service_type: document.getElementById("serviceType").value,
    original_price: num("originalPrice"),
    redeem_amount: redeemed ? num("redeemAmount") : 0,
    extra_amount: num("extraAmount"),
    notes: (groomRedemption ? GROOM_RULE + "\n" : "") + document.getElementById("usageNotes").value.trim().replaceAll(GROOM_RULE, ""),
    signature: canvas.toDataURL("image/png"),
    operator_name: document.getElementById("operatorName").value.trim(),
    voided: false,
    redeemed: redeemed,
    signed_at: new Date().toISOString()
  };

  const { error } = await client.from("transactions").insert(row);

  if (error) {
    alert("儲存失敗：" + error.message);
    return;
  }

  if (activateOnSave) {
    const activationExpiry = addDays(row.service_date, selectedPass.shared_pass ? 25 : 45);
    const activation = await client.from("passes").update({expiry_date: activationExpiry}).eq("id", passId).is("expiry_date", null).select("id");
    if (activation.error) {
      usageSaving = false;
      closeUsage();
      await refreshData();
      alert("消費與簽名已儲存，請勿重複登錄。啟用期限儲存失敗，請在修改計次券填入使用期限：" + activationExpiry + "；" + activation.error.message);
      return;
    }
  }
  alert(groomRedemption ? "已簽名並折抵1次，贈送一次已取消" : redeemed ? "已完成扣次與簽名" : "已保存本次未折抵消費與簽名");
  usageSaving = false;
  closeUsage();
  await refreshData();
}

/* =========================
   紀錄
========================= */
function setRecordFilter(
  filter,
  button
) {
  recordFilter = filter;

  button
    .parentElement
    .querySelectorAll(".chip")
    .forEach(element => {
      element.classList.remove("active");
    });

  button.classList.add("active");

  renderRecords();
}

function renderRecords() {
  const dateInput = document.getElementById("recordDate");
  if (!dateInput) return;

  const date = dateInput.value || today();
  const keyword = document.getElementById("recordSearch").value.trim().toLowerCase();

  let list = transactions.filter(
    transaction => (recordFilter === "voided" ? transaction.voided : !transaction.voided) && transaction.service_date === date
  );

  list = list.filter(transaction => {
    const pass = passes.find(p => p.id === transaction.pass_id);
    const text = [
      pass?.pet_name,
      pass?.owner_name,
      pass?.phone,
      transaction.service_type,
      transaction.operator_name
    ].join(" ").toLowerCase();

    if (keyword && !text.includes(keyword)) return false;
    if (recordFilter === "redeemed") return transaction.redeemed !== false;
    if (recordFilter === "notRedeemed") return transaction.redeemed === false;
    if (recordFilter === "signed") return hasSignature(transaction);
    if (recordFilter === "unsigned") return !hasSignature(transaction);
    return true;
  });

  const box = document.getElementById("recordsList");
  const summary = document.getElementById("recordSummary");

  const dayAll = transactions.filter(
    transaction => !transaction.voided && transaction.service_date === date
  );

  const signed = dayAll.filter(hasSignature).length;
  const noRedeem = dayAll.filter(transaction => transaction.redeemed === false).length;

  summary.textContent = `${date}｜共 ${dayAll.length} 筆｜已簽 ${signed}｜未簽 ${dayAll.length - signed}｜未折抵 ${noRedeem}`;

  if (!list.length) {
    box.innerHTML = '<div class="muted">這個條件沒有紀錄</div>';
    return;
  }

  const nextRecordKey = date + "|" + keyword + "|" + recordFilter;
  if (recordKey !== nextRecordKey) { recordKey = nextRecordKey; recordLimit = 50; }
  box.innerHTML = list.slice(0,recordLimit).map(transaction => {
    const pass = passes.find(p => p.id === transaction.pass_id);

    return `
      <div class="record-row">
        <div class="record-head">
          <div><b>${esc(pass?.pet_name || "未知毛孩")}</b>・${esc(pass?.owner_name || "")}</div>
          <div>
            ${hasSignature(transaction)
              ? '<span class="signed">已簽名</span>　<details style="display:inline-block" ontoggle="loadSignatureImage(this,decodeURIComponent(\'' + encodeURIComponent(transaction.id).replace(/'/g, '%27') + '\'))"><summary style="color:#06c;text-decoration:underline;cursor:pointer">查看簽名</summary><div class="signature-image muted">點開才載入簽名</div></details>'
              : '<span class="unsigned">未簽名</span>'}
          </div>
        </div>

        <div class="muted">
          ${transaction.voided ? "已作廢（不扣次）｜" : ""}${transaction.redeemed === false
            ? "未折抵"
            : "第 " + (transaction.sequence_no || "-") + " 次折抵"}
          ｜${esc(transaction.service_type || "")}
          ｜補差 $${money(transaction.extra_amount)}
          ｜經手 ${esc(transaction.operator_name || "-")}
        </div>

        ${transaction.notes ? `<div class="muted">備註：${esc(String(transaction.notes).replace("【大美容折抵2次，取消贈次】", GROOM_RULE))}</div>` : ""}
        ${!transaction.voided ? `<div class="top-actions" style="margin-top:8px">
          <button class="btn small secondary" onclick="openSignatureCorrection(decodeURIComponent('${encodeURIComponent(transaction.id).replace(/'/g, '%27')}'))">更正簽名／重簽</button>
          <button class="btn small secondary" onclick="issueRemoteLink(decodeURIComponent('${encodeURIComponent(transaction.id).replace(/'/g, '%27')}'))">傳手機簽名連結</button>
          <button class="btn small secondary" onclick="voidMistakenUsage(decodeURIComponent('${encodeURIComponent(transaction.id).replace(/'/g, '%27')}'))">簽錯券／作廢此筆</button>
        </div>` : ""}
      </div>
    `;
  }).join("") + (list.length > recordLimit ? '<button class="btn secondary" onclick="recordLimit += 50; renderRecords()">載入更多紀錄</button>' : "");
}

/* =========================
   頁面切換
========================= */
function showPage(name, button) {
  [
    "search",
    "create",
    "records"
  ].forEach(pageName => {
    document
      .getElementById(
        pageName + "Page"
      )
      .classList.toggle(
        "hidden",
        pageName !== name
      );
  });

  document
    .querySelectorAll(".tab")
    .forEach(element => {
      element.classList.remove("active");
    });

  button.classList.add("active");

  if (name === "records") {
    renderRecords();
  }
}

function setUsageFieldsLocked(locked) {
  ["serviceDate", "redeemedSelect", "serviceType", "originalPrice", "redeemAmount", "extraAmount", "operatorName", "usageNotes"].forEach(id => {
    document.getElementById(id).disabled = locked;
  });
}

function openSignatureCorrection(id) {
  const record = transactions.find(t => t.id === id && !t.voided);
  const pass = passes.find(p => p.id === record?.pass_id);
  if (!record || !pass) return alert("找不到此筆紀錄或計次券");
  selectedPass = pass;
  editingTransactionId = id;
  document.getElementById("usageModal").classList.remove("hidden");
  document.getElementById("usageTitle").textContent = "更正此筆顧客簽名";
  document.getElementById("saveUsageButton").textContent = "儲存重簽（不再扣次）";
  document.getElementById("usagePassInfo").innerHTML = `<b>${esc(pass.pet_name)}</b>｜${esc(pass.owner_name)}｜${esc(record.service_date)}｜${esc(record.service_type)}<br>請確認飼主與毛孩，再請顧客重簽；只更新此筆簽名，不新增消費或扣次。`;
  const values = {serviceDate: record.service_date, redeemedSelect: record.redeemed !== false ? "true" : "false", serviceType: record.service_type, originalPrice: record.original_price, redeemAmount: record.redeem_amount, extraAmount: record.extra_amount, operatorName: record.operator_name, usageNotes: String(record.notes || "").replace("【大美容折抵2次，取消贈次】", GROOM_RULE)};
  Object.entries(values).forEach(([id, value]) => document.getElementById(id).value = value ?? "");
  setUsageFieldsLocked(true);
  clearSignature();
  requestAnimationFrame(setupSignature);
}

const voidingRecords = new Set();
async function voidMistakenUsage(id) {
  if (voidingRecords.has(id)) return;
  const record = transactions.find(t => t.id === id && !t.voided);
  const pass = passes.find(p => p.id === record?.pass_id);
  if (!record) return;
  if (!confirm(`確定作廢 ${pass?.pet_name || ""}／${pass?.owner_name || ""} 的 ${record.service_date} 這筆紀錄？\n${record.redeemed !== false ? "此筆扣次將回復。" : "此筆未扣次。"}原紀錄與簽名保留；請另選正確計次券重新登錄及簽名。`)) return;
  voidingRecords.add(id);
  try {
    const stamp = new Date().toISOString();
    const voidQuery = client.from("transactions").update({voided: true, notes: (record.notes || "") + "\n[簽錯券作廢 " + stamp + "] 請另選正確券重新登錄"}).eq("id", id).eq("voided", false);
    const { data, error } = await withSignedAtMatch(voidQuery, record.signed_at).select("id");
    if (error) return alert("作廢失敗：" + error.message);
    if (!data?.length) return alert("紀錄已被更動，請重新整理後再試");
    await refreshData();
    if (selectedPass) {
      selectedPass = passes.find(p => p.id === selectedPass.id) || selectedPass;
      renderSelectedPass();
    }
    alert("已作廢此筆，請選正確計次券重新登錄及簽名");
  } catch (error) {
    alert("作廢失敗：" + (error.message || String(error)));
  } finally {
    voidingRecords.delete(id);
  }
}

function redrawSignature() {
  const canvas = document.getElementById("signatureCanvas");
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * ratio);
  canvas.height = Math.round(rect.height * ratio);
  const context = canvas.getContext("2d");
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  context.lineWidth = 3;
  context.lineCap = "round";
  context.lineJoin = "round";
  context.strokeStyle = "#111";
  signatureStrokes.forEach(stroke => {
    context.beginPath();
    stroke.forEach((p, i) => {
      const x = p.x * rect.width, y = p.y * rect.height;
      if (!i) context.moveTo(x, y);
      else context.lineTo(x, y);
    });
    if (stroke.length === 1) {
      context.lineTo(stroke[0].x * rect.width + 0.1, stroke[0].y * rect.height + 0.1);
    }
    context.stroke();
  });
}

function setupSignature() {
  const canvas = document.getElementById("signatureCanvas");
  if (!canvas) return;
  redrawSignature();
  let activePointer = null;
  function point(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) / rect.width, y: (event.clientY - rect.top) / rect.height };
  }
  canvas.onpointerdown = event => {
    if (activePointer !== null || (event.pointerType === "mouse" && event.button !== 0)) return;
    event.preventDefault();
    activePointer = event.pointerId;
    canvas.setPointerCapture(event.pointerId);
    drawing = true;
    signatureHasInk = true;
    signatureStrokes.push([point(event)]);
    document.getElementById("signatureState").textContent = "已簽名";
    document.getElementById("signatureState").className = "signed";
    redrawSignature();
  };
  canvas.onpointermove = event => {
    if (!drawing || event.pointerId !== activePointer) return;
    event.preventDefault();
    signatureStrokes[signatureStrokes.length - 1].push(point(event));
    redrawSignature();
  };
  function end(event) {
    if (event.pointerId !== activePointer) return;
    drawing = false;
    activePointer = null;
  }
  canvas.onpointerup = end;
  canvas.onpointercancel = end;
  canvas.onlostpointercapture = end;
  if (!signatureObserver && window.ResizeObserver) {
    signatureObserver = new ResizeObserver(() => {
      if (!document.getElementById("usageModal").classList.contains("hidden")) redrawSignature();
    });
    signatureObserver.observe(canvas);
  }
}

function clearSignature() {
  drawing = false;
  signatureHasInk = false;
  signatureStrokes = [];
  const canvas = document.getElementById("signatureCanvas");
  if (canvas) {
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    // Reset handlers and pointer state when starting another signature.
    setupSignature();
  }
  const state = document.getElementById("signatureState");
  if (state) {
    state.textContent = "尚未簽名";
    state.className = "muted";
  }
}
window.addEventListener("resize", () => {
  if (!document.getElementById("usageModal").classList.contains("hidden")) redrawSignature();
});


function withSignedAtMatch(query, stamp) {
  return stamp == null ? query.is("signed_at", null) : query.eq("signed_at", stamp);
}

async function remoteRequest(body, staff = false) {
  const headers = {"Content-Type":"application/json", apikey:SUPABASE_PUBLISHABLE_KEY};
  if (staff) {
    const {data,error} = await client.auth.getSession();
    if (error || !data.session) throw new Error("請重新登入店內系統");
    headers.Authorization = "Bearer " + data.session.access_token;
  }
  const response = await fetch(REMOTE_API, {method:"POST",headers,body:JSON.stringify(body),cache:"no-store"});
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || "暫時無法處理");
  return result;
}

async function issueRemoteLink(id) {
  if (usageSaving) return;
  const record = transactions.find(t => t.id === id && !t.voided);
  if (!record) return alert("找不到紀錄，請重新整理。");
  if (!confirm("產生24小時有效的" + (hasSignature(record) ? "重簽" : "補簽") + "連結？舊連結會失效，這個動作不會再扣次。")) return;
  usageSaving = true;
  try {
    const result = await remoteRequest({action:"issue",transaction_id:id},true);
    showRemoteLink(result,id);
  } catch(error) {alert(error.message || "無法產生連結");}
  finally {usageSaving=false;}
}

async function saveRemoteUsage() {
  if (usageSaving) return;
  if (editingTransactionId) {
    const id = editingTransactionId;
    await issueRemoteLink(id);
    return;
  }
  if (!selectedPass) return alert("請先選券");
  if (!confirm("確認先儲存本次服務與扣次，再傳連結給客人簽名？簽名未完成仍會保留本次扣次，請在紀錄頁追蹤。")) return;
  usageSaving=true;
  const button=document.getElementById("remoteUsageButton");
  const localButton=document.getElementById("saveUsageButton");
  button.disabled=localButton.disabled=true;
  if(!remoteOperationId) remoteOperationId=crypto.randomUUID();
  try {
    const data={pass_id:selectedPass.id,service_date:document.getElementById("serviceDate").value || today(),
      service_type:document.getElementById("serviceType").value,redeemed:document.getElementById("redeemedSelect").value==="true",
      original_price:num("originalPrice"),redeem_amount:num("redeemAmount"),extra_amount:num("extraAmount"),
      notes:document.getElementById("usageNotes").value.trim(),operator_name:document.getElementById("operatorName").value.trim()};
    if (![data.original_price,data.redeem_amount,data.extra_amount].every(n=>Number.isFinite(n)&&n>=0&&n<=1000000)) throw new Error("請確認金額為有效的非負數字");
    const result=await remoteRequest({action:"create",operation_id:remoteOperationId,data},true);
    usageSaving=false;
    closeUsage();
    showRemoteLink(result,result.transaction_id);
    await refreshData();
  } catch(error) {alert((error.message || "處理失敗") + "\n若網路中斷，請先查紀錄；不要另開一筆。同一畫面重試不會重複扣次。");}
  finally {usageSaving=false;button.disabled=localButton.disabled=false;}
}

function closeRemoteLink() {
  clearInterval(remoteLinkTimer);
  remoteLinkTimer=null;
  document.getElementById("remoteLinkModal")?.remove();
}

function showRemoteLink(result,id) {
  closeRemoteLink();
  const base=new URL(location.href);base.hash="";base.search="";
  const url=base.href+"#sign="+result.token;
  const modal=document.createElement("div");modal.id="remoteLinkModal";
  modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:130;padding:20px;overflow:auto";
  modal.innerHTML=`<div class="card" style="max-width:540px;margin:20px auto"><h2>客人手機簽名</h2><p class="muted">24小時有效，簽完失效。請只傳給這筆紀錄的客人。</p><label>簽名連結（可長按複製）</label><textarea id="remoteLinkText" readonly></textarea><div id="remoteQR" style="text-align:center;margin:16px 0"></div><p id="remoteLinkStatus" role="status">等待客人簽名</p><button id="copyRemoteLink" class="btn">複製連結，貼到 LINE</button><button id="shareRemoteLink" class="btn secondary">分享連結</button><button class="btn secondary" onclick="closeRemoteLink()">關閉（連結仍有效）</button></div>`;
  document.body.appendChild(modal);
  document.getElementById("remoteLinkText").value=url;
  document.getElementById("copyRemoteLink").onclick=async()=>{
    try {await navigator.clipboard.writeText(url);document.getElementById("remoteLinkStatus").textContent="已複製，請貼到客人的 LINE";}
    catch {document.getElementById("remoteLinkText").select();alert("請長按連結選擇複製");}
  };
  document.getElementById("shareRemoteLink").onclick=async()=>{
    if(!navigator.share) return document.getElementById("copyRemoteLink").click();
    try {await navigator.share({title:"孩要有你｜本次服務簽名",text:"請確認本次服務後簽名，連結24小時內有效。",url});}catch{}
  };
  function drawQR(){
    if(!window.qrcode || !document.getElementById("remoteQR")) return;
    const qr=window.qrcode(0,"M");qr.addData(url);qr.make();
    document.getElementById("remoteQR").innerHTML=qr.createSvgTag({cellSize:4,margin:4,scalable:true});
    const svg=document.querySelector("#remoteQR svg");if(svg)svg.style.cssText="max-width:280px;width:100%;background:white";
  }
  if(window.qrcode)drawQR();
  else {
    let script=document.getElementById("remoteQRLibrary");
    if(!script){script=document.createElement("script");script.id="remoteQRLibrary";script.src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";script.referrerPolicy="no-referrer";document.head.appendChild(script);}
    script.addEventListener("load",drawQR,{once:true});
    script.onerror=()=>{const el=document.getElementById("remoteQR");if(el)el.textContent="QR Code 載入失敗，仍可複製連結傳送。";};
  }
  const initial=transactions.find(t=>t.id===id)?.signed_at || null;
  let checking=false;
  remoteLinkTimer=setInterval(async()=>{
    if(checking || document.hidden)return;checking=true;
    try{
      const {data,error}=await client.from("transaction_summaries").select("has_signature,signed_at,voided").eq("id",id).single();
      if(error)return;
      if(data.voided || (hasSignature(data) && data.signed_at!==initial)){
        document.getElementById("remoteLinkStatus").textContent=data.voided?"此筆已作廢，連結無法再簽名":"已收到客人簽名 ✓";
        clearInterval(remoteLinkTimer);await refreshData();
      }
    }finally{checking=false;}
  },8000);
}

async function openCustomerSignature(token) {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("mainApp").classList.add("hidden");
  const page=document.createElement("main");page.style.cssText="max-width:650px;margin:auto;padding:18px";
  page.innerHTML=`<div class="card"><h1 style="font-size:23px">孩要有你｜服務簽名</h1><p id="customerSignStatus" role="status">正在讀取本次服務…</p><div id="customerSignInfo"></div><div id="customerSignForm" class="hidden"><p>請核對毛孩、日期、服務與金額。如有不符，請勿簽名並聯絡店家。</p><div class="signature-wrap"><canvas id="customerCanvas" style="width:100%;height:clamp(150px,38dvh,280px);display:block;touch-action:none"></canvas></div><button id="customerClear" class="btn secondary">清除重簽</button><label><input id="customerAgree" type="checkbox" style="width:auto"> 我已核對以上服務與金額，確認送出簽名</label><button id="customerSubmit" class="btn">確認送出簽名</button><p class="muted">本頁只補簽／重簽，不會新增扣次。請勿將連結轉傳給他人。</p></div></div>`;
  document.body.appendChild(page);
  const state=document.getElementById("customerSignStatus");
  try {
    const data=await remoteRequest({action:"read",token});
    state.textContent=data.is_correction?"本次為更正簽名":"請完成本次服務簽名";
    document.getElementById("customerSignInfo").innerHTML=`<div class="notice"><b>${esc(data.pet_name)}</b>${data.shared_pet_name?"／"+esc(data.shared_pet_name):""}<br>日期：${esc(data.service_date)}<br>服務：${esc(data.service_type)}<br>${data.redeemed?"本次折抵1次"+(data.gift_cancelled?"，取消贈次":""):"本次不折抵"}<br>服務原價：$${money(data.original_price)}<br>扣抵金額：$${money(data.redeem_amount)}<br>補差額：$${money(data.extra_amount)}</div>`;
    document.getElementById("customerSignForm").classList.remove("hidden");
    const canvas=document.getElementById("customerCanvas");let strokes=[],pointer=null,saving=false;
    function redraw(){const rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;if(!rect.width)return;canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);const ctx=canvas.getContext("2d");ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";strokes.forEach(s=>{ctx.beginPath();s.forEach((p,i)=>{const x=p.x*rect.width,y=p.y*rect.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});if(s.length===1)ctx.lineTo(s[0].x*rect.width+.1,s[0].y*rect.height+.1);ctx.stroke();});}
    const point=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};};
    canvas.onpointerdown=e=>{if(saving||pointer!==null||(e.pointerType==="mouse"&&e.button!==0))return;e.preventDefault();pointer=e.pointerId;canvas.setPointerCapture(pointer);strokes.push([point(e)]);redraw();};
    canvas.onpointermove=e=>{if(saving||e.pointerId!==pointer)return;e.preventDefault();strokes[strokes.length-1].push(point(e));redraw();};
    canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=e=>{if(pointer===e.pointerId)pointer=null;};
    const observer=new ResizeObserver(redraw);observer.observe(canvas);redraw();
    document.getElementById("customerClear").onclick=()=>{if(!saving){strokes=[];pointer=null;redraw();}};
    document.getElementById("customerSubmit").onclick=async()=>{
      if(saving)return;
      if(!strokes.length)return alert("請先簽名");
      if(!document.getElementById("customerAgree").checked)return alert("請先核對並勾選確認");
      saving=true;document.getElementById("customerSubmit").disabled=true;
      document.getElementById("customerClear").disabled=true;
      state.textContent="簽名傳送中，請勿關閉…";
      try {
        await remoteRequest({action:"sign",token,signature:canvas.toDataURL("image/png")});
        observer.disconnect();document.getElementById("customerSignForm").classList.add("hidden");
        state.textContent="簽名已完成，謝謝您！可以關閉此頁，不會再次扣次。";
        history.replaceState(null,"",location.pathname);
      } catch(error){state.textContent=error.message+" 若剛剛已送出但網路中斷，請先向店家確認簽名是否收到。";saving=false;document.getElementById("customerSubmit").disabled=false;document.getElementById("customerClear").disabled=false;}
    };
  } catch(error){state.textContent=error.message || "連結無法使用，請聯絡店家。";}
}
