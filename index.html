<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>孩要有你｜電子計次券</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f7f7f7;
      color: #222;
    }
    .app {
      max-width: 600px;
      margin: auto;
      padding: 24px 18px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }
    .sub {
      color: #777;
      margin-bottom: 28px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .card p {
      color: #777;
      margin: 0 0 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>孩要有你｜電子計次券</h1>
    <div class="sub">寵物美容計次券管理系統</div>

    <div class="card">
      <h2>🐶 客戶與寵物</h2>
      <p>建立與查詢客戶、寵物資料</p>
   <button onclick="alert('客戶管理功能正常')">客戶管理</button>>
    </div>

    <div class="card">
      <h2>🎫 電子計次券</h2>
      <p>開券、查詢剩餘次數與有效期限</p>
      <button>計次券管理</button>
    </div>

    <div class="card">
      <h2>✍️ 使用紀錄</h2>
      <p>扣除次數、紀錄服務與顧客簽名</p>
      <button>使用計次券</button>
    </div>

    <div class="card">
      <h2>⚙️ 服務方案</h2>
      <p>管理美容方案與買 4 送 1 規則</p>
      <button>方案設定</button>
    </div>
  </div>
</body>
</html>
